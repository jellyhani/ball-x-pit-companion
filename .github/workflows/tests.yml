name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        native: ['0', '1']
    name: Tests (BXP_NO_NATIVE=${{ matrix.native }})
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create venv and install dependencies
        shell: pwsh
        run: |
          uv venv .venv --python 3.13
          uv pip install --python .venv\Scripts\python.exe -r requirements.txt
      - name: Run tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          BXP_NO_NATIVE: ${{ matrix.native }}
          BXP_DATA_DIR: ${{ runner.temp }}/bxp-test-data
          BXP_APP_DIR: ${{ runner.temp }}/bxp-test-profile
        run: .venv\Scripts\python.exe -m unittest discover -s tests -t . -v
